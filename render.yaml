# Connect a MongoDB deployment before creating this Blueprint. Render does not
# provision MongoDB from this file; set MONGO_URL in the Render dashboard.
services:
  - type: web
    name: cars-dealership
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 'true'
      - key: COOKIE_SECURE
        value: 'true'
      - key: MONGO_URL
        sync: false
