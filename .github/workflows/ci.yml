name: Cars Dealership CI

on:
  push:
    paths-ignore:
      - 'evidence/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install API dependencies
        working-directory: services/dealers
        run: npm ci

      - name: Check and test API
        working-directory: services/dealers
        run: npm run check

      - name: Install React dependencies
        working-directory: server/frontend
        run: npm ci

      - name: Build React
        working-directory: server/frontend
        run: npm run build

      - name: Build and start MongoDB and app
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: Smoke test running application
        run: |
          set -euo pipefail
          curl --retry 10 --retry-delay 3 --retry-all-errors --fail http://localhost:3000/health
          curl --fail http://localhost:3000/api/get_dealers
          curl --fail http://localhost:3000/api/get_cars
          username="ci_$(date +%s)"
          curl --fail --silent --show-error -c /tmp/cars-cookies \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$username\",\"first_name\":\"CI\",\"last_name\":\"Tester\",\"email\":\"$username@example.com\",\"password\":\"CI-only-password-123\"}" \
            http://localhost:3000/api/register
          curl --fail --silent --show-error -b /tmp/cars-cookies \
            -H 'Content-Type: application/json' \
            -d '{"dealer_id":1,"review":"Great service and a clear explanation.","rating":5,"purchase":false}' \
            http://localhost:3000/api/add_review

      - name: Collect container logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down -v
